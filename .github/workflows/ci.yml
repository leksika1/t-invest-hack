# Все джобы идут на self-hosted раннере на сервере Dokploy (метка tinvest, сервис
# actions.runner.leksika1-t-invest-hack.tinvest-server, пользователь gha-runner) — см. docs/OPERATIONS.md.
# Локально те же проверки: scripts/ci.sh + .githooks/pre-push для dev/main.
# Этапы ci.yml и scripts/ci.sh держать согласованными — меняете один, меняйте и другой.
# Деплой — джоба deploy через секреты DOKPLOY_WEBHOOK_* в окружениях dev/prod.
# Прямые вебхуки GitHub → Dokploy в Settings → Webhooks не добавлять — будут двойные деплои.
# Репозиторий публичный: PR из форков на раннере не запускаются (условие if у джоб), для workflow из форков
# включено ручное одобрение, а открывать PR/issues могут только коллабораторы (interaction limits).
name: CI/CD

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

# Минимальные права токена GITHUB_TOKEN: только чтение кода
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: backend tests
    # Публичный репозиторий + self-hosted раннер: код из форков на раннере не выполняем.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, tinvest]
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: bonds_test
          POSTGRES_USER: bonds
          POSTGRES_PASSWORD: ci
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U bonds -d bonds_test"
          --health-interval 2s --health-timeout 3s --health-retries 30
    defaults:
      run:
        working-directory: backend
    # Same PostgreSQL/pgvector db tests as scripts/ci.sh, using an ephemeral host port.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      # Известные уязвимости в зависимостях — сборка падает
      - run: pip-audit -r requirements.txt
      # Все тесты из backend/tests подхватываются сами; e2e без E2E_BASE_URL пропускаются (их гоняет build)
      - run: pytest -q
        env:
          TEST_DATABASE_URL: postgresql+psycopg://bonds:ci@127.0.0.1:${{ job.services.postgres.ports[5432] }}/bonds_test

  frontend-checks:
    name: frontend checks
    # Публичный репозиторий + self-hosted раннер: код из форков на раннере не выполняем.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, tinvest]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # Найденная уязвимость (high и выше) валит сборку. Недоступность сервиса аудита (503, таймаут) —
      # не уязвимость: 3 попытки, затем предупреждение, чтобы сбой на стороне npm не блокировал деплой
      - name: npm audit
        run: |
          for attempt in 1 2 3; do
            if npm audit --audit-level=high > audit.log 2>&1; then cat audit.log; exit 0; fi
            cat audit.log
            if ! grep -qiE "audit endpoint returned an error|service unavailable|ETIMEDOUT|ECONNRESET|EAI_AGAIN" audit.log; then
              exit 1
            fi
            echo "Сервис аудита npm недоступен, попытка $attempt из 3"; sleep 20
          done
          echo "::warning::npm audit не выполнен: сервис аудита npm недоступен. Уязвимости проверит следующий запуск."
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # Собирает образы, поднимает весь стек (nginx → backend → Postgres)
  # и прогоняет e2e-тесты по HTTP через nginx
  build:
    # Имя "build" — его удобно сделать обязательной проверкой в правилах защиты веток; не переименовывать
    name: build
    needs: [backend-tests, frontend-checks]
    runs-on: [self-hosted, tinvest]
    env:
      POSTGRES_PASSWORD: bonds
      COMPOSE: docker compose -f docker-compose.yml -f docker-compose.e2e.yml -f docker-compose.ci.yml
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Validate Dokploy compose files
        env:
          BACKEND_ALIAS: tinvest-backend-ci
          LLM_NETWORK: tinvest-backend-ci-llm
        run: |
          docker compose -f backend/docker-compose.yml config -q
          docker compose -f frontend/docker-compose.yml config -q
          docker compose -f deploy/llm-proxy/docker-compose.yml config -q

      - name: Build images
        run: $COMPOSE build

      - name: Start stack
        run: $COMPOSE up -d --wait

      - name: E2E tests against the stack
        working-directory: backend
        env:
          E2E_BASE_URL: http://127.0.0.1:18080
        run: |
          pip install -r requirements-dev.txt
          pytest -q tests/e2e

      - name: Stack logs
        if: failure()
        run: $COMPOSE logs --no-color --tail=200

      - name: Stop stack
        if: always()
        run: $COMPOSE down -v

  deploy:
    name: deploy
    needs: build
    if: github.event_name == 'push'
    runs-on: [self-hosted, tinvest]
    # Окружения dev/prod в Settings → Environments, в каждом секреты
    # DOKPLOY_WEBHOOK_FRONTEND и DOKPLOY_WEBHOOK_BACKEND (Dokploy → сервис → Deployments → Webhook URL)
    environment: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}
    strategy:
      fail-fast: false
      matrix:
        service: [frontend, backend]
    steps:
      # Dokploy принимает вебхук только в формате push-события GitHub и на несовпадение
      # ветки отвечает 301, поэтому проверяем, что ответ именно 200
      - name: Trigger Dokploy deploy (${{ matrix.service }})
        env:
          WEBHOOK_URL: ${{ matrix.service == 'frontend' && secrets.DOKPLOY_WEBHOOK_FRONTEND || secrets.DOKPLOY_WEBHOOK_BACKEND }}
        run: |
          if [ -z "$WEBHOOK_URL" ]; then
            echo "::error::Секрет вебхука для ${{ matrix.service }} не задан в окружении"
            exit 1
          fi
          code=$(curl -sS -o response.txt -w '%{http_code}' -X POST "$WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -H "X-GitHub-Event: push" \
            -d "{\"ref\": \"$GITHUB_REF\", \"head_commit\": {\"message\": \"CI deploy $GITHUB_SHA\"}, \"commits\": []}")
          cat response.txt; echo
          if [ "$code" != "200" ]; then
            echo "::error::Dokploy ответил $code"
            exit 1
          fi
